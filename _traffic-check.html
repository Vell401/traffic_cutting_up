<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка игрового трафика</title><style>body{margin:0;background:#151d2b;font:16px sans-serif;color:white}header{padding:14px}button{padding:10px;margin:3px}canvas{display:block}#status{margin:12px}</style><header>Игровой TrafficView · 8 моделей · общие материалы и LOD <button id="day">День / ночь</button><button id="brake">Стоп-сигналы</button><button id="blink">Аварийка</button><button id="lod">Сменить LOD</button><button id="fleet">112 машин</button><span id="status"></span></header><canvas id="c"></canvas><script type="module">
import * as T from 'three';
import { TrafficView } from '/src/render/trafficView.ts';
import { Sim } from '/src/sim/world.ts';
import { VEHICLES } from '/src/sim/vehicles.ts';
import { mulberry32 } from '/src/core/rng.ts';
const sim=new Sim(mulberry32(17)), renderer=new T.WebGLRenderer({canvas:document.querySelector('#c'),antialias:true});
renderer.setSize(innerWidth,innerHeight-90);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;
const scene=new T.Scene();scene.background=new T.Color('#cbd2dc');const camera=new T.PerspectiveCamera(42,innerWidth/(innerHeight-90),.1,2000);
const light=new T.HemisphereLight(0xdceaff,0x4e4439,2.7);scene.add(light);const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(-20,25,8);scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(1000,1000).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x7e8895}));ground.position.y=-.02;scene.add(ground);
const traffic=new TrafficView(new T.Texture());scene.add(traffic.group);traffic.group.getObjectByName('traffic/shadows').visible=false;
sim.player.s=sim.player.prevS=0;sim.player.d=sim.player.prevD=0;
// Straight coordinates make all models and both sides readable in a deterministic audit scene.
sim.road.toWorld=(s,d,p)=>Object.assign(p,{x:d,z:-s,th:0,k:0});
let lod=0,fleet=false,brake=false,blink=false,night=false;
function setup(){sim.traffic.cars.forEach((c,i)=>{c.active=i<(fleet?112:8);c.spec=VEHICLES[i%8];c.s=c.prevS=Math.floor(i/4)*18;c.d=c.prevD=(i%4-1.5)*5.7;c.gen++;c.color=[0x168bd8,0xf17928,0x647b64,0xb3bfcf,0xe5c766,0xcb5145,0x8b4042,0x64758c][i%8];c.color2=0xd5dce3;c.yaw=c.prevYaw=0;});camera.position.set(fleet?75:21,fleet?100:19,fleet?90:23);camera.lookAt(0,0,fleet?-180:-9);}
setup();document.querySelector('#day').onclick=()=>{night=!night;scene.background.set(night?'#080f20':'#cbd2dc');light.intensity=night?.9:2.7;sun.intensity=night?.55:3;};
document.querySelector('#brake').onclick=()=>brake=!brake;document.querySelector('#blink').onclick=()=>blink=!blink;
document.querySelector('#lod').onclick=()=>{lod=(lod+1)%3;sim.player.s=sim.player.prevS=[0,-80,-500][lod];setup();};
document.querySelector('#fleet').onclick=()=>{fleet=!fleet;setup();};
function frame(time){sim.traffic.cars.forEach(c=>{c.braking=brake;c.blink=blink?2:0;});traffic.update(sim,1,0,0,time/1000);renderer.render(scene,camera);document.querySelector('#status').textContent=`${fleet?112:8} машин · LOD ${lod} · ${renderer.info.render.calls} draws · ${renderer.info.render.triangles} tris · стоп ${brake?'ON':'OFF'} · аварийка ${blink?'ON':'OFF'}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
