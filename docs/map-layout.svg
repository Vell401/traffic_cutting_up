<g class="feature"><circle cx="606" cy="399" r="13" /><circle cx="369" cy="615" r="13" /><circle cx="1067" cy="546" r="13" /><circle cx="782" cy="375" r="13" /><circle cx="478" cy="1125" r="13" /></g>
<g font-size="12" font-weight="bold" text-anchor="middle" fill="#17242b"><text x="606" y="403" style="fill:#17242b">F1</text><text x="369" y="619" style="fill:#17242b">F2</text><text x="1067" y="550" style="fill:#17242b">F3</text><text x="782" y="379" style="fill:#17242b">F4</text><text x="478" y="1129" style="fill:#17242b">F5</text></g>
<path d="M1357 204V149" stroke="#dde7ec" stroke-width="2" marker-end="url(#arrow)" /><text x="1349" y="138" class="label">С</text>
<text x="66" y="1272" class="small muted">Два разделённых направления на каждом коридоре · левостороннее движение.</text>
<text x="66" y="1300" class="tiny muted">География задаёт изгибы: холмы, кварталы, набережные, железная дорога и портовые территории.</text>

<rect x="1435" y="106" width="440" height="1225" rx="18" fill="#192a35" />
<text x="1460" y="146" font-size="23" font-weight="bold">НЕ КОЛЬЦА ПО ЛИНЕЙКЕ</text>
<g class="small"><text x="1460" y="183">R0 огибает холмы и береговые выступы.</text><text x="1460" y="211">C1/C2 — вытянутые городские коридоры</text><text x="1460" y="239">с разными изгибами и общей развязкой.</text><text x="1460" y="267">C3 добавляет нижний путь между ними.</text></g>
<path d="M1460 293H1847" stroke="#38505b" />
<text x="1460" y="331" class="label">ТРИ ВХОДА В ГОРОД</text>
<g class="small"><text x="1460" y="365" fill="#aed089">J1 → S1: запад / старые кварталы</text><text x="1460" y="395" fill="#aed089">J2 → S2: север / городская долина</text><text x="1460" y="425" fill="#aed089">J3 → S3: восток / набережная</text><text x="1460" y="459" class="muted">Разнесены примерно на трети кольца.</text><text x="1460" y="486" class="muted">Точный баланс расстояний — в прототипе.</text></g>
<path d="M1460 513H1847" stroke="#38505b" />
<text x="1460" y="551" class="label">ПРЕДВАРИТЕЛЬНЫЕ ДЛИНЫ</text>
<g class="small"><text x="1460" y="585" fill="#e8b661">R0 · 33–39 км · предложение 3+3</text><text x="1460" y="616" fill="#61ccdc">C1 · 7–8,5 км · 2+2</text><text x="1460" y="647" fill="#ac9ce9">C2 · 8–9,5 км · 2+2</text><text x="1460" y="678" fill="#7db8cb">C3 · 2–3 км · 2+2</text><text x="1460" y="709" fill="#aed089">S1/S2/S3 · по 3,3–4,2 км · 2+2</text><text x="1460" y="747" font-weight="bold">Всего ≈ 60–73 км осей дорог.</text><text x="1460" y="775" class="muted">Примерно ×1,5 к варианту 01.</text><text x="1460" y="802" class="muted">Без удвоения за встречную сторону.</text></g>
<path d="M1460 828H1847" stroke="#38505b" />
<text x="1460" y="865" class="label">МЕСТА ДЛЯ ПРЕИМУЩЕСТВА</text>
<g class="small"><text x="1460" y="899">F1 · дополнительная полоса</text><text x="1460" y="928">F2 · обочина и возврат до сужения</text><text x="1460" y="957">F3 · подъём за городской террасой</text><text x="1460" y="986">F4 · параллельный распределитель</text><text x="1460" y="1015">F5 · расширение у портовой дороги</text></g>
<path d="M1460 1042H1847" stroke="#38505b" />
<text x="1460" y="1078" class="label">КАК ЧИТАТЬ</text>
<g class="small"><text x="1460" y="1112">Кружки J — реальные примыкания.</text><text x="1460" y="1141">X1 — развязка разных уровней:</text><text x="1460" y="1170">связи через светлые рампы.</text><text x="1460" y="1199">Пунктир — тоннель; P — парковка.</text></g>
<text x="1460" y="1240" class="tiny muted">Рампы показаны концептуально, не по радиусам.</text><text x="1460" y="1265" class="tiny muted">Любое другое пересечение без узла —</text><text x="1460" y="1288" class="tiny muted">разные уровни, перехода между дорогами нет.</text>
<text x="43" y="1370" class="small muted">Вариант 02 · на согласование · форма и протяжённость обновлены по обратной связи пользователя</text>
</svg>