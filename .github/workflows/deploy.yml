# Every push to main is tested on GitHub's runners (the Tests workflow), then built and deployed on
# the VPS by the self-hosted runner there (registered with deploy/runner-register.sh). deploy.sh
# checks the live site from the outside (HTTPS, version, assets, real clients over wss) and rolls
# back to the previous images if anything fails.
#
# The repository is public: this runner must only ever take pushes to main. Never give it a
# pull_request trigger (a fork's pull request could run its own code on the server).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, vps_ru]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build, restart, check from outside (rollback on failure)
        run: bash deploy/deploy.sh
        env:
          # Repository variable (Settings → Secrets and variables → Actions → Variables); empty = the server's IP.
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
          # The test job above has run the whole suite on this commit: the image build skips it.
          SKIP_TESTS: "1"
          # Repository secret (Settings → Secrets and variables → Actions → Secrets): the admin page's
          # password. Unset = no admin page.
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
